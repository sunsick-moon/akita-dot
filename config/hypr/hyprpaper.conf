# This file is regenerated automatically by ~/.config/scripts/switch_colors.sh
# every time you set a new wallpaper (via waypaper or matugen), so there's no
# wallpaper hardcoded here out of the box. Pick one with `waypaper`, or set
# `preload`/`wallpaper` manually below, e.g.:
#
# preload = /home/you/Pictures/Wallpapers/my-wallpaper.jpg
# wallpaper = ,/home/you/Pictures/Wallpapers/my-wallpaper.jpg

splash = false
ipc = on
