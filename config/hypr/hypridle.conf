# hypridle - idle management daemon for Hyprland
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# Started automatically from autostart.lua. Safe to use with uwsm: this only
# locks the session / suspends the machine, it never terminates Hyprland.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock the session after 5 minutes idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the screen off after 10 minutes idle (and back on on resume)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 20 minutes idle
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
