# --- Configuración General ---
map ctrl+shift+c copy_to_clipboard
map ctrl+v paste_from_clipboard

allow_remote_control yes
background_opacity 0.7
enable_background_blur yes
background_blur 1

# --- Colores Principales (Material You) ---
background {{ colors.surface.default.hex }}
foreground {{ colors.on_surface.default.hex }}
cursor {{ colors.primary.default.hex }}
cursor_text_color {{ colors.on_primary.default.hex }}
selection_background {{ colors.primary_container.default.hex }}
selection_foreground {{ colors.on_primary_container.default.hex }}
url_color {{ colors.tertiary.default.hex }}

# --- Bordes de Ventana (Kitty layouts) ---
active_border_color {{ colors.primary.default.hex }}
inactive_border_color {{ colors.outline_variant.default.hex }}

# --- Paleta ANSI Normal (Colores Saturados con Tono) ---
color0 {{ colors.surface.default.hex }}
color1 {{ colors.error.default.hex }}
color2 {{ colors.primary.default.hex }}
color3 {{ colors.secondary.default.hex }}
color4 {{ colors.tertiary.default.hex }}
color5 {{ colors.inverse_primary.default.hex }}
color6 {{ colors.secondary.default.hex }}
color7 {{ colors.on_surface_variant.default.hex }}

# --- Paleta ANSI Bright (Acentos Vivos y Legibles) ---
color8  {{ colors.outline.default.hex }}
color9  {{ colors.error.default.hex }}
color10 {{ colors.primary.default.hex }}
color11 {{ colors.secondary.default.hex }}
color12 {{ colors.tertiary.default.hex }}
color13 {{ colors.inverse_primary.default.hex }}
color14 {{ colors.tertiary.default.hex }}
color15 {{ colors.on_surface.default.hex }}
