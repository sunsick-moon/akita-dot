[config]
# Wallpaper is applied by ~/.config/scripts/switch_colors.sh (hyprpaper), not
# by matugen itself, since Hyprland needs hyprctl hot-reload rather than a
# generic wallpaper-setter command.
#
# IMPORTANT: do NOT add a [config.wallpaper] section here unless you also set
# a `command` under it. In current matugen, `command` is a required (non
# optional) field of that table: if the table is present without `command`,
# matugen fails to parse this whole file ("missing field `command`") and
# silently aborts before generating any templates, since switch_colors.sh
# calls matugen with `|| true`. Leaving [config.wallpaper] out entirely is
# how you tell matugen to skip wallpaper-setting without errors.

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/kitty.conf'

[templates.mako]
input_path = '~/.config/matugen/templates/mako'
output_path = '~/.config/mako/config'

[templates.wofi]
input_path = '~/.config/matugen/templates/wofi.css'
output_path = '~/.config/wofi/style.css'

[templates.luacolors]
input_path = '~/.config/matugen/templates/colors.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar-colors.css'
output_path = '~/.config/matugen/generated/waybar-colors.css'

[templates.superfile]
input_path = '~/.config/matugen/templates/spf_matugen.toml'
output_path = '~/.config/superfile/theme/spf_matugen.toml'

[templates.nmtui]
input_path = '~/.config/matugen/templates/nmtui'
output_path = '~/.config/nmtui/palette'

[templates.custom_css]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/generated/colors.css'
# Forces this template to be processed last regardless of declaration order,
# so the post_hook below only fires once every other template has been
# (re)generated.
index = 100
post_hook = 'hyprctl reload && killall -SIGUSR2 waybar'
